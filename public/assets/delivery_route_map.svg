<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0E0A07" />
      <stop offset="50%" stop-color="#15100C" />
      <stop offset="100%" stop-color="#0C0906" />
    </linearGradient>
    <linearGradient id="riverGrad" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10211B" stop-opacity="0.55" />
      <stop offset="100%" stop-color="#0D1914" stop-opacity="0.35" />
    </linearGradient>
    <linearGradient id="routeGlow" x1="140" y1="300" x2="1040" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D4AF37" />
      <stop offset="55%" stop-color="#52B788" />
      <stop offset="100%" stop-color="#D4AF37" />
    </linearGradient>
    <pattern id="minorGrid" width="48" height="48" patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48" fill="none" stroke="#F7F2EB" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
    <pattern id="majorGrid" width="192" height="192" patternUnits="userSpaceOnUse">
      <path d="M 192 0 L 0 0 0 192" fill="none" stroke="#D4AF37" stroke-opacity="0.07" stroke-width="1.2" />
    </pattern>
  </defs>

  <!-- Base Map Canvas -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#minorGrid)" />
  <rect width="1200" height="420" fill="url(#majorGrid)" />

  <!-- Stylized Park & Waterway Zones (Lindenwold / Camden County Corridors) -->
  <path d="M -20 340 Q 260 270 520 330 T 1220 250 L 1220 430 L -20 430 Z" fill="url(#riverGrad)" />
  <ellipse cx="320" cy="115" rx="135" ry="52" fill="#1E6B43" fill-opacity="0.08" />
  <ellipse cx="830" cy="295" rx="150" ry="58" fill="#1E6B43" fill-opacity="0.08" />

  <!-- Neighborhood City Blocks -->
  <g fill="#1B140F" stroke="#F7F2EB" stroke-opacity="0.05" stroke-width="1">
    <rect x="60" y="45" width="110" height="65" rx="6" />
    <rect x="190" y="45" width="85" height="65" rx="6" />
    <rect x="60" y="130" width="140" height="80" rx="6" />
    <rect x="220" y="140" width="120" height="70" rx="6" />
    <rect x="370" y="55" width="130" height="75" rx="6" />
    <rect x="525" y="48" width="145" height="82" rx="6" />
    <rect x="410" y="160" width="150" height="90" rx="6" />
    <rect x="585" y="155" width="130" height="85" rx="6" />
    <rect x="740" y="52" width="140" height="72" rx="6" />
    <rect x="905" y="48" width="125" height="68" rx="6" />
    <rect x="750" y="148" width="135" height="82" rx="6" />
    <rect x="910" y="145" width="175" height="88" rx="6" />
    <rect x="480" y="275" width="160" height="72" rx="6" />
    <rect x="665" y="270" width="120" height="75" rx="6" />
  </g>

  <!-- Secondary Arterial Roads -->
  <g stroke="#F7F2EB" stroke-opacity="0.09" stroke-width="6" stroke-linecap="round">
    <path d="M 0 120 L 1200 120" />
    <path d="M 0 245 L 1200 245" />
    <path d="M 205 0 L 205 420" />
    <path d="M 570 0 L 570 420" />
    <path d="M 895 0 L 895 420" />
    <path d="M 90 0 L 420 420" />
    <path d="M 680 0 L 1060 420" />
  </g>

  <!-- Major Highway / Blackwood-Clementon Corridor -->
  <path
    d="M 40 335 C 230 330, 310 215, 490 210 C 670 205, 760 155, 1150 115"
    stroke="#2A2019"
    stroke-width="18"
    stroke-linecap="round"
  />
  <path
    d="M 40 335 C 230 330, 310 215, 490 210 C 670 205, 760 155, 1150 115"
    stroke="#D4AF37"
    stroke-opacity="0.18"
    stroke-width="2"
    stroke-dasharray="8 8"
  />

  <!-- Highlighted Delivery Route Path (Origin -> Checkpoints -> Destination) -->
  <path
    d="M 140 300 C 275 295, 345 215, 490 210 C 640 205, 785 155, 1040 125"
    stroke="url(#routeGlow)"
    stroke-opacity="0.28"
    stroke-width="10"
    stroke-linecap="round"
  />
  <path
    d="M 140 300 C 275 295, 345 215, 490 210 C 640 205, 785 155, 1040 125"
    stroke="url(#routeGlow)"
    stroke-width="3.5"
    stroke-dasharray="10 7"
    stroke-linecap="round"
  />

  <!-- Subtle Map Labels -->
  <g fill="#F7F2EB" fill-opacity="0.38" font-family="monospace" font-size="11" letter-spacing="1.5">
    <text x="72" y="378">BLACKWOOD-CLEMENTON RD · LINDENWOLD, NJ</text>
    <text x="455" y="188">WHITE HORSE PIKE CORRIDOR</text>
    <text x="780" y="96">GREATER CAMDEN COUNTY DELIVERY ZONE</text>
  </g>

  <!-- Waypoint Nodes Along the Delivery Path -->
  <!-- Origin Node (Faminas Kitchen) -->
  <circle cx="140" cy="300" r="14" fill="#D4AF37" fill-opacity="0.2" />
  <circle cx="140" cy="300" r="7" fill="#D4AF37" stroke="#0F0B08" stroke-width="2.5" />

  <!-- Midpoint 1: Order Prepared & Packed -->
  <circle cx="365" cy="236" r="5.5" fill="#52B788" stroke="#0F0B08" stroke-width="2" />

  <!-- Midpoint 2: Dispatched / En Route -->
  <circle cx="645" cy="195" r="5.5" fill="#52B788" stroke="#0F0B08" stroke-width="2" />

  <!-- Midpoint 3: Approaching Neighborhood -->
  <circle cx="860" cy="152" r="5.5" fill="#52B788" stroke="#0F0B08" stroke-width="2" />

  <!-- Destination Node (Customer Address) -->
  <circle cx="1040" cy="125" r="16" fill="#52B788" fill-opacity="0.22" />
  <circle cx="1040" cy="125" r="7.5" fill="#52B788" stroke="#0F0B08" stroke-width="2.5" />
</svg>
